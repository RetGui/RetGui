[package]
name = "gallery"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gallery"
path = "main.rs"

[features]
audio = ["retgui/audio"]
default = ["audio"]

[dependencies]
retgui_builder = { path = "../../builder" }
serde = { version = "1", features = ["derive"] }
util = { path = "../util" }

[dependencies.reqwest]
workspace = true
default-features = false
features = ["json", "rustls"]

[dependencies.retgui]
path = "../../retgui"
default-features = false
features = [
    "http_client",
    "jpeg",
    "png",
    "clipboard",
    "vello_gpu_renderer"
]
