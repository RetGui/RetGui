[package]
name = "jsframeworkbench"
version = "0.1.0"
edition = "2024"
default-run = "jsframeworkbench"

[[bin]]
name = "jsframeworkbench"
path = "main.rs"

[dependencies]

rand = "0.10.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dependencies.retgui]
path = "../../retgui"
default-features = false
features = ["system_fonts", "vello_gpu_renderer"]
