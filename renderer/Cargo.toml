[package]
name = "retgui_renderer"
version = "0.1.1"
edition.workspace = true

[features]
vello_cpu_renderer = ["dep:vello_cpu", "dep:softbuffer", "dep:vello_common", "dep:glifo"]
vello_gpu_renderer = ["dep:vello_gpu", "dep:vello_common", "dep:glifo", "dep:wgpu", "wgpu/fragile-send-sync-non-atomic-wasm"]
vello_gpu_renderer_webgl = ["wgpu/webgl"]

[dependencies]

[dependencies.glifo]
git = "https://github.com/linebender/vello.git"
rev = "0268b37f5c54fc3970707b1c525d555c568d67dd"
default-features = false
features = ["std"]
optional = true

[dependencies.vello_cpu]
git = "https://github.com/linebender/vello.git"
rev = "0268b37f5c54fc3970707b1c525d555c568d67dd"
optional = true
features = []

[dependencies.vello_gpu]
git = "https://github.com/linebender/vello.git"
rev = "0268b37f5c54fc3970707b1c525d555c568d67dd"
default-features = false
features = ["default"]
optional = true

[dependencies.vello_common]
git = "https://github.com/linebender/vello.git"
rev = "0268b37f5c54fc3970707b1c525d555c568d67dd"
optional = true
default-features = false
features = ["std"]

[dependencies.softbuffer]
version = "0.4.8"
optional = true

[dependencies.wgpu]
version = "30.0.1"
default-features = false
features = ["wgsl", "vulkan", "dx12"]
optional = true

[dependencies.peniko]
workspace = true

[dependencies.retgui_primitives]
path = "../primitives"
default-features = false
version = "0.1.1"


[dependencies.retgui_resource_manager]
path = "../resource_manager"
default-features = false
version = "0.1.1"

[dependencies.winit]
workspace = true
